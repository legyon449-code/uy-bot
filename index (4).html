<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uylar e'lonlari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f5f7);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --accent: var(--tg-theme-button-color, #2f80ed);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 24px;
  }
  header {
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
  }
  .filters {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
  }
  .filter-btn {
    border: none;
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    white-space: nowrap;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .grid {
    display: grid;
    gap: 12px;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #ddd;
  }
  .card .no-photo {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--hint);
    background: #e5e5ea;
  }
  .card-body {
    padding: 12px 14px;
  }
  .price {
    font-size: 18px;
    font-weight: 700;
  }
  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ijarada { background: #e3f2ff; color: #0b6bcb; }
  .badge.sotuvda { background: #fff4e0; color: #b26a00; }
  .badge.sotilgan { background: #e6f7e9; color: #1f8a3d; }
  .desc {
    margin-top: 6px;
    color: var(--hint);
    font-size: 14px;
  }
  .empty {
    text-align: center;
    color: var(--hint);
    padding: 40px 16px;
  }
</style>
</head>
<body>
  <header>🏠 Uylar e'lonlari</header>
  <div class="filters">
    <button class="filter-btn active" data-f="all">Barchasi</button>
    <button class="filter-btn" data-f="ijarada">Ijarada</button>
    <button class="filter-btn" data-f="sotuvda">Sotuvda</button>
    <button class="filter-btn" data-f="sotilgan">Sotilgan</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Hozircha e'lonlar yo'q.</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let all = [];
  let currentFilter = 'all';

  async function load() {
    try {
      const res = await fetch('/api/listings');
      all = await res.json();
      render();
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'Ma\'lumotlarni yuklab bo\'lmadi.';
    }
  }

  function render() {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const items = currentFilter === 'all' ? all : all.filter(x => x.status === currentFilter);
    grid.innerHTML = '';
    if (!items.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    for (const l of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        ${l.photoUrl
          ? `<img src="${l.photoUrl}" loading="lazy">`
          : `<div class="no-photo">Rasm yo'q</div>`}
        <div class="card-body">
          <span class="price">${l.priceFormatted}</span>
          <span class="badge ${l.status}">${l.statusLabel}</span>
          <div class="desc">${l.desc ? l.desc : ''}</div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.f;
      render();
    });
  });

  load();
</script>
</body>
</html>
